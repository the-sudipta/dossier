[package]
name = "dossier-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Safe, offline course documentation workspace generator"

[workspace]
members = ["src-tauri"]
resolver = "2"

[dependencies]
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dossier-cli"
path = "src/main.rs"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
